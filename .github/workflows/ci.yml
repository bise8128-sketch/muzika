name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Documentation Link Validation ───────────────────────────────
  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate documentation links
        run: python3 scripts/check_md_links.py

  # ─── Next.js: Lint, Type Check, Unit Tests, Build ────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audio-karaoke-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: audio-karaoke-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check
        continue-on-error: true

      - name: Unit tests (Jest)
        run: npx jest --ci --coverage --forceExit --passWithNoTests
        env:
          CI: true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage
          path: audio-karaoke-app/coverage/
          retention-days: 14

      - name: Build
        run: npm run build

  # ─── Python Backend Tests ────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-audio-cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python-audio-cli/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx
          pip install fastapi uvicorn python-multipart werkzeug redis
          # Install torch CPU-only for testing (much smaller)
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install yt-dlp colorlog numpy scipy

      - name: Run Python tests
        run: pytest tests/ -v --tb=short
        env:
          MOCK_SEPARATION: "true"

  # ─── Playwright E2E Tests ────────────────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    needs: [frontend] # Only run E2E if frontend builds successfully
    defaults:
      run:
        working-directory: audio-karaoke-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: audio-karaoke-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (Chromium only)
        run: npx playwright test --project=chromium --reporter=html
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: audio-karaoke-app/playwright-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: audio-karaoke-app/test-results/
          retention-days: 7

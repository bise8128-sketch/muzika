name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Documentation link validation job
  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate documentation links
        run: python3 scripts/check_md_links.py

  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audio-karaoke-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: audio-karaoke-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check
        continue-on-error: true # pre-existing TS errors in api routes

      - name: Unit tests
        run: npx jest --ci --coverage --forceExit --passWithNoTests
        env:
          CI: true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: audio-karaoke-app/coverage/
          retention-days: 14

      - name: Build
        run: npm run build
